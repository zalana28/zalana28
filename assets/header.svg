<svg fill="none" viewBox="0 0 800 180" width="800" height="180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b0e13" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e6edf3" />
      <stop offset="100%" stop-color="#9aa7b4" />
    </linearGradient>

    <style>
      .name {
        font-family: 'Georgia', 'Times New Roman', serif;
        font-weight: 400;
        font-size: 44px;
        letter-spacing: 14px;
        fill: url(#nameGrad);
      }
      .role {
        font-family: 'SF Mono', 'Fira Code', Menlo, monospace;
        font-weight: 400;
        font-size: 11px;
        letter-spacing: 5px;
        fill: #6e7681;
      }
      .rule { stroke: #21262d; stroke-width: 1; }
      .accent { stroke: #58a6ff; stroke-width: 1; stroke-opacity: 0.55; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="180" fill="url(#bg)" />

  <!-- Hairline frame -->
  <rect x="24" y="24" width="752" height="132" fill="none" class="rule" />

  <!-- Small accent ticks on frame corners -->
  <path d="M 24 24 h 18" class="accent" />
  <path d="M 24 24 v 18" class="accent" />
  <path d="M 776 156 h -18" class="accent" />
  <path d="M 776 156 v -18" class="accent" />

  <!-- Name -->
  <text class="name" x="414" y="88" text-anchor="middle">ZALANA</text>

  <!-- Divider -->
  <line x1="330" y1="112" x2="470" y2="112" class="rule" />
  <line x1="386" y1="112" x2="414" y2="112" class="accent" />

  <!-- Role -->
  <text class="role" x="400" y="136" text-anchor="middle">EVM ARCHITECT · WEB3 · SINCE 2018</text>
</svg>
