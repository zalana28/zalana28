<svg fill="none" viewBox="0 0 160 160" width="160" height="160" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <clipPath id="circleClip">
      <circle cx="80" cy="80" r="70" />
    </clipPath>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Glow ring -->
  <circle cx="80" cy="80" r="74" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-opacity="0.3" filter="url(#glow)" />

  <!-- Main ring -->
  <circle cx="80" cy="80" r="72" fill="none" stroke="#2dd4bf" stroke-width="2.5" />

  <!-- Photo clipped to circle -->
  <image xlink:href="./avatar.jpg" x="10" y="10" width="140" height="140" clip-path="url(#circleClip)" preserveAspectRatio="xMidYMid slice" />
</svg>
